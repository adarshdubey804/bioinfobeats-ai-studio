services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  api:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with db service hostname}
      REDIS_URL: ${REDIS_URL:?Set authenticated REDIS_URL with redis service hostname}
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - media_data:/data/media
      - private_media_data:/data/private-media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging

  worker:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with db service hostname}
      REDIS_URL: ${REDIS_URL:?Set authenticated REDIS_URL with redis service hostname}
    volumes:
      - media_data:/data/media
      - private_media_data:/data/private-media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    logging: *default-logging

  beat:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with db service hostname}
      REDIS_URL: ${REDIS_URL:?Set authenticated REDIS_URL with redis service hostname}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=INFO
    logging: *default-logging

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/api/v1
    depends_on:
      api: {condition: service_healthy}
    logging: *default-logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  media_data:
  private_media_data:
  caddy_data:
  caddy_config:
