name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MEDIA_STORAGE_DIR: /tmp/bioinfobeats-test-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && PYTHONPATH=. pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd frontend && npm install
      - run: cd frontend && npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Wait for API and verify database-backed authentication
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8000/api/v1/health/ready
          curl -fsS -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password-123"}' >/dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password-123"}' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8000/api/v1/workflows -H "Authorization: Bearer $TOKEN" >/dev/null
      - name: Verify frontend responds
        run: curl -fsS http://localhost:3000/ >/dev/null
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
