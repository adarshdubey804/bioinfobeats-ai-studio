services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioinfobeats}
      POSTGRES_USER: ${POSTGRES_USER:-bioinfobeats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioinfobeats} -d ${POSTGRES_DB:-bioinfobeats}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: ./backend}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bioinfobeats:local-dev-only@db:5432/bioinfobeats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    volumes: ["media_data:/data/media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: {context: ./backend}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bioinfobeats:local-dev-only@db:5432/bioinfobeats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes: ["media_data:/data/media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO
  web:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  media_data:
